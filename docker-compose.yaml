services:
  digital_service_ecosystem-ngrok:
    image: ngrok/ngrok:latest
    container_name: digital_service_ecosystem-ngrok
    restart: no
    ports:
      - "${NGROK_UI_PORT}:4040"
    command: http host.docker.internal:${NGROK_LOCAL_HTTP_REGISTER_PORT}
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    networks:
      - my_docker_network

  digital_service_ecosystem-traefik:
    image: traefik:latest
    container_name: digital_service_ecosystem-traefik
    restart: no
    security_opt:
      - no-new-privileges:true
    ports:
      - 80:80
      - ${TRAEFIK_UI_PORT}:9090
    volumes:
      # - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./digital_service_ecosystem/traefik/certs:/etc/traefik/certs:ro
      - ./digital_service_ecosystem/traefik/traefik-data/traefik.yml:/traefik.yml:ro
      - ./digital_service_ecosystem/traefik/traefik-data/configurations:/configurations
      - ./digital_service_ecosystem/traefik/traefik-data/acme.json:/acme.json
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=my_docker_network"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.rule=Host(`${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=cors@file"
      - "traefik.http.routers.traefik.middlewares=user-auth@file"
    networks:
      - my_docker_network
  
  digital_service_ecosystem-be_notification_service:
    image: thanhldt060802/personal-project-digital_service_ecosystem-notification_service:main-latest
    container_name: digital_service_ecosystem-notification_service
    restart: no
    # ports:
    #   - "${BE_NOTIFICATION_SERVICE_PORT}:8000"
    volumes:
      - ./digital_service_ecosystem/notification_service/config:/app/config
      - ./digital_service_ecosystem/notification_service/tmp:/app/tmp
    networks:
      - my_docker_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=my_docker_network"
      - "traefik.http.routers.notification-service.rule=Host(`${TRAEFIK_DOMAIN}`) && PathPrefix(`/notification`)"
      - "traefik.http.routers.notification-service.entrypoints=web"
      - "traefik.http.routers.notification-service.middlewares=cors@file"
      - "traefik.http.services.notification-service.loadbalancer.server.port=8000"

  # digital_service_ecosystem-xxx_service:
  #   image: thanhldt060802/personal-project-digital_service_ecosystem-xxx_service:main-latest
  #   container_name: digital_service_ecosystem-xxx_service
  #   restart: no
  #   # ports:
  #   #   - "${XXX_SERVICE_PORT}:8000"
  #   volumes:
  #     - ./digital_service_ecosystem/xxx_service/config:/app/config
  #     - ./digital_service_ecosystem/xxx_service/tmp:/app/tmp
  #   networks:
  #     - my_docker_network
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.docker.network=my_docker_network"
  #     - "traefik.http.routers.xxx-service.rule=Host(`${TRAEFIK_DOMAIN}`) && PathPrefix(`/xxx`)"
  #     - "traefik.http.routers.xxx-service.entrypoints=web"
  #     - "traefik.http.routers.xxx-service.middlewares=cors@file"
  #     - "traefik.http.services.xxx-service.loadbalancer.server.port=8000"

networks:
  my_docker_network:
    external: true